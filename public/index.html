<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: barra lateral fixa de módulos + área de trabalho; no celular a barra vira abas no topo */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaefed; --fg:#1b2624; --muted:#5d6d69; --line:#d7e0dd;
  --accent:#1f6f62; --accent-soft:#d6ebe6; --accent-fg:#ffffff; --gold:#a8834a; --gold-soft:#f2e8d6;
  --ok:#2e7d4f; --ok-soft:#dcf0e3; --warn:#9a6a12; --warn-soft:#f7ebcf; --bad:#b03a3a; --bad-soft:#f6dddd;
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211f; --surface-2:#202c29; --fg:#e4ecea; --muted:#9aaba7; --line:#2c3a37;
  --accent:#4fb8a5; --accent-soft:#1d3a35; --accent-fg:#0b1513; --gold:#d3ad72; --gold-soft:#3a2f1e;
  --ok:#6cc690; --ok-soft:#1c3427; --warn:#e2b45a; --warn-soft:#3a2f17; --bad:#ec8080; --bad-soft:#3d2121; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211f; --surface-2:#202c29; --fg:#e4ecea; --muted:#9aaba7; --line:#2c3a37;
  --accent:#4fb8a5; --accent-soft:#1d3a35; --accent-fg:#0b1513; --gold:#d3ad72; --gold-soft:#3a2f1e;
  --ok:#6cc690; --ok-soft:#1c3427; --warn:#e2b45a; --warn-soft:#3a2f17; --bad:#ec8080; --bad-soft:#3d2121; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.01em;display:block}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--surface-2);color:var(--fg)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo-note{margin-top:auto;font-size:12px;color:var(--muted);background:var(--gold-soft);border-radius:8px;padding:10px 12px}
.demo-note button{all:unset;cursor:pointer;color:var(--gold);font-weight:600;text-decoration:underline;margin-top:4px;display:inline-block}
main{padding-block:28px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:28px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{font:inherit;font-weight:600;border:1px solid transparent;background:var(--accent);color:var(--accent-fg);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi small{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{grid-template-columns:1.4fr 1fr;margin-top:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-agendado{background:var(--surface-2);color:var(--muted)}
.p-confirmado{background:var(--accent-soft);color:var(--accent)}
.p-realizado{background:var(--ok-soft);color:var(--ok)}
.p-faltou,.p-cancelado{background:var(--bad-soft);color:var(--bad)}
.p-pago{background:var(--ok-soft);color:var(--ok)}
.p-pendente{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.time{font-family:var(--f-display);font-weight:600;font-size:15px;width:52px;flex:none;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600}
.grow span{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.toolbar input{max-width:280px}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:160px;min-width:0}
.day.today{border-color:var(--accent)}
.day h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px;text-transform:capitalize}
.day h3 b{font-size:20px;color:var(--fg);display:block;font-weight:600}
.appt{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12.5px}
.appt.s-realizado{border-color:var(--ok)}.appt.s-faltou,.appt.s-cancelado{border-color:var(--bad);opacity:.7}.appt.s-agendado{border-color:var(--muted)}
.appt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.proc .cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:600}
.proc h3{font-size:16px}
.proc .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.proc .price{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--fg)}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.empty{color:var(--muted);padding:12px 0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rank{display:flex;flex-direction:column;gap:12px}
.rank div{font-size:13px}
.rank .lbl{display:flex;justify-content:space-between;gap:8px}
.rank .lbl span{color:var(--muted);font-variant-numeric:tabular-nums}
/* modal */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.mhead{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.mhead h2{font-size:19px}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
form.f{padding:16px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
form.f .full{grid-column:1/-1}
form.f .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.detail{padding:14px 20px 20px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px}
.facts small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.note{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop input{max-width:320px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.map label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px}
.steps b{display:block;font-family:var(--f-display);color:var(--accent)}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.muted{color:var(--muted);font-size:12.5px}
dialog.wide{width:min(820px,calc(100vw - 32px))}
form.f .sec{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
form.f label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
form.f label.chk input{width:auto}
.att{display:flex;flex-direction:column;gap:10px}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface-2);border-radius:8px;padding:12px}
.sub .full{grid-column:1/-1}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.anx{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12.5px;max-width:260px;min-width:0}
.chip img{width:36px;height:36px;object-fit:cover;border-radius:4px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .pdf{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:10px;padding:8px 6px;border-radius:4px}
.chip .x{font-size:16px;padding:0 4px}
.ev{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ev small,.facts small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ev .txt{white-space:pre-wrap;font-size:13.5px}
.doc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.doc b{color:var(--accent)}.doc button{margin-left:auto}
@media (max-width:720px){.sub{grid-template-columns:1fr}}
.me{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:auto}
.me .grow b{font-size:13px}.me .grow span{font-size:11.5px}
.me .link{font-size:12.5px}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.demo-note{margin-top:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.lock{max-width:420px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
td select{min-width:130px}
@media (max-width:720px){.me{margin:0;padding:4px 8px;flex:none}.me .grow span{display:none}}
[hidden]{display:none!important}
.pixbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.pixbox textarea{font-size:11px;font-family:ui-monospace,monospace;margin:4px 0}
#qr{background:#fff;padding:8px;border-radius:8px;line-height:0}
.mapgrid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.face{width:100%;max-width:220px;background:var(--surface-2);border-radius:10px;cursor:crosshair;display:block}
.face .fc{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}.face .fl{fill:none;stroke:var(--muted);stroke-width:1}
.face .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.2}.face .ptl{font-size:8px;fill:var(--fg);font-family:var(--f-body);font-weight:600}
.cmp{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:10px;background:var(--surface-2)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}.cmp-a{position:absolute;inset:0 auto 0 0;overflow:hidden;border-right:2px solid #fff;z-index:1}
.cmp-a img{height:100%}.cmp .tag{position:absolute;top:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:99px}.cmp .l{left:8px}.cmp .r{right:8px}
.termo{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:13px;max-height:220px;overflow:auto}
.sig{width:100%;height:150px;border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.sigmini{width:70px;height:30px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid var(--line)}
.legend{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400;display:flex;align-items:center;gap:6px}.lg{display:inline-block;width:10px;height:10px;border-radius:2px}.lg.r,.chart .br{background:var(--accent);fill:var(--accent)}.lg.d,.chart .bd{background:var(--gold);fill:var(--gold)}
.chart-wrap{overflow-x:auto}.chart{width:100%;min-width:420px;height:auto}.chart .gl{stroke:var(--line)}.chart .ax{font-size:9px;fill:var(--muted);font-family:var(--f-body)}
.phone{border:10px solid var(--fg);border-radius:30px;max-width:340px;margin:0 auto;overflow:hidden;background:var(--bg)}
.phone-in{height:600px;overflow-y:auto}
.bk{display:flex;flex-direction:column;gap:8px;padding:0 14px 16px}
.bk-h{background:var(--accent);color:var(--accent-fg);margin:0 -14px 6px;padding:18px 14px}.bk-h b{display:block;font-family:var(--f-display);font-size:18px}.bk-h span{font-size:12px;opacity:.85}
.bk-t{font-weight:600;font-size:13px;margin-top:4px}.bk-back{font-size:12.5px;align-self:flex-start}
.bk-o{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.bk-o b{display:block;font-size:13px}.bk-o span{font-size:12px;color:var(--muted)}.bk-o:hover{border-color:var(--accent)}
.bk-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.bk-days button{all:unset;cursor:pointer;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.bk-days button span{display:block;font-size:11px;color:var(--muted);text-transform:capitalize}.bk-days button b{font-size:16px}.bk-days button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.bk-days button.on span{color:var(--accent-fg)}
.bk-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bk-slots button{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-weight:600;font-size:13px;background:var(--surface)}.bk-slots button:hover{border-color:var(--accent);color:var(--accent)}
.bk-sum{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.bk-o:focus-visible,.bk-days button:focus-visible,.bk-slots button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:980px){.two[style*="380px"]{grid-template-columns:1fr!important}}
@media (max-width:720px){.kpi b{font-size:20px;overflow-wrap:anywhere}.mapgrid{grid-template-columns:1fr}.detail .grid[style*="repeat(3"]{grid-template-columns:1fr!important}}
label.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--fg);font-size:13px}
label.chk input{width:auto;flex:none}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;font-size:13px;z-index:50}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{padding:0;flex:none}.brand b{font-size:16px}.brand span{display:none}
  nav{flex-direction:row}nav button{padding:7px 10px;white-space:nowrap}
  .demo-note{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
  .week{grid-template-columns:1fr}.day{min-height:0}
  form.f,.facts{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.au{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.au-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.au-card h1{font-size:22px}.au-card label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.au-brand b{font-family:var(--f-display);font-size:22px;display:block}.au-brand span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.au-msg{margin:0;font-size:13px;color:var(--muted)}.au-msg.err{color:var(--bad)}
.au-links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
#sync{font-weight:600}#sync.err{color:var(--bad)}
#instalar{margin-top:6px}
</style></head><body>
<div id="carregando" class="au"><div class="au-card"><p>Carregando…</p></div></div>
<div id="auth" class="au" hidden><form id="au-form" class="au-card">
  <div class="au-brand"><b>Clínica Bezerra</b><span>Estética avançada</span></div>
  <h1 id="au-t">Entrar</h1>
  <label id="au-mail-w">E-mail<input id="au-mail" type="email" autocomplete="username" required></label>
  <label id="au-pass-w">Senha<input id="au-pass" type="password" autocomplete="current-password" minlength="6"></label>
  <button class="btn" id="au-btn">Entrar</button>
  <p id="au-msg" class="au-msg" role="status"></p>
  <div id="au-links" class="au-links"><button type="button" class="link" onclick="trocaModo('criar')">Primeiro acesso</button><button type="button" class="link" onclick="trocaModo('esqueci')">Esqueci a senha</button><button type="button" class="link" onclick="trocaModo('entrar')">Entrar</button></div>
</form></div>
<div class="app" hidden>
  <aside>
    <div class="brand"><b>Clínica Bezerra</b><span>Estética avançada</span></div>
    <nav id="nav">
      <button data-v="painel">Painel</button>
      <button data-v="agenda">Agenda</button>
      <button data-v="pacientes">Pacientes</button>
      <button data-v="pacotes">Pacotes</button>
      <button data-v="procedimentos">Procedimentos</button>
      <button data-v="estoque">Estoque</button>
      <button data-v="financeiro">Financeiro</button>
      <button data-v="relatorios">Relatórios</button>
      <button data-v="marketing">Marketing</button>
      <button data-v="online">Agendamento online</button>
      <button data-v="importar">Importar dados</button>
      <button data-v="admin">Administração</button>
    </nav>
    <div class="me" id="me"></div>
    <div class="demo-note"><span id="sync">Conectando…</span><br><button id="instalar" hidden onclick="instalarApp()">Instalar aplicativo</button></div>
  </aside>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script type="text/plain" id="app-src">
const $=s=>document.querySelector(s);
const BRL=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>parse(s).toLocaleDateString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const TODAY=new Date();TODAY.setHours(0,0,0,0);const T=iso(TODAY);
const PROF=['Dra. Ana Bezerra','Dra. Carla Mota','Juliana (esteticista)'];
const STATUS=['agendado','confirmado','realizado','faltou','cancelado'];

function seed(){
  const procs=[
    {id:'p1',nome:'Toxina botulínica (3 áreas)',cat:'Injetáveis',preco:1490,dur:40,sessoes:1,retorno:15},
    {id:'p2',nome:'Preenchimento labial',cat:'Injetáveis',preco:1690,dur:60,sessoes:1,retorno:30},
    {id:'p3',nome:'Bioestimulador de colágeno',cat:'Injetáveis',preco:2400,dur:60,sessoes:2,retorno:30},
    {id:'p4',nome:'Microagulhamento facial',cat:'Facial',preco:450,dur:60,sessoes:4,retorno:30},
    {id:'p5',nome:'Peeling químico',cat:'Facial',preco:380,dur:45,sessoes:3,retorno:21},
    {id:'p6',nome:'Limpeza de pele profunda',cat:'Facial',preco:220,dur:75,sessoes:1,retorno:30},
    {id:'p7',nome:'Ultrassom microfocado',cat:'Tecnologias',preco:2900,dur:90,sessoes:1,retorno:90},
    {id:'p8',nome:'Depilação a laser (axilas)',cat:'Tecnologias',preco:180,dur:20,sessoes:8,retorno:30},
    {id:'p9',nome:'Enzimas para gordura localizada',cat:'Corporal',preco:350,dur:30,sessoes:6,retorno:7},
  ];
  const nomes=[['Mariana Albuquerque','(81) 99812-4410','1989-03-14','Pele oleosa, acne leve na adolescência. Sem alergias conhecidas.'],
    ['Patrícia Lins','(81) 98877-1203','1978-07-02','Hipertensa controlada. Usa protetor diariamente.'],
    ['Renata Cavalcanti','(81) 99654-3321','1993-11-21','Melasma em região malar. Evitar ácidos fortes no verão.'],
    ['Fernanda Souza','(81) 98123-7788','1985-01-30','Alergia a dipirona.'],
    ['Camila Torres','(81) 99701-5566','1997-05-09',''],
    ['Luciana Barros','(81) 98444-9012','1972-09-17','Busca rejuvenescimento sem cirurgia. Fez toxina em 2025.'],
    ['Rafael Monteiro','(81) 99230-6655','1990-12-03','Interesse em laser na barba.'],
    ['Beatriz Andrade','(81) 98765-1122','2000-04-25','Gestante? Não. Sem medicações.']];
  const pacientes=nomes.map((n,i)=>({id:'c'+i,nome:n[0],tel:n[1],nasc:n[2],obs:n[3],desde:iso(addDays(TODAY,-30*(i+2)))}));
  const ag=[];const fin=[];
  const mk=(dOff,h,ci,pi,prof,st)=>{const id=uid();const d=iso(addDays(TODAY,dOff));ag.push({id,data:d,hora:h,pac:'c'+ci,proc:'p'+pi,prof:PROF[prof],status:st});
    if(st==='realizado'){const p=procs.find(x=>x.id==='p'+pi);fin.push({id:uid(),data:d,tipo:'receita',desc:p.nome+' · '+pacientes[ci].nome,valor:p.preco,status:dOff<-3?'pago':'pendente',forma:['Pix','Cartão de crédito','Dinheiro'][ci%3],ag:id})}};
  const dow=TODAY.getDay();const mon=dow===0?-6:1-dow;
  mk(-20,'10:00',5,1,0,'realizado');mk(-18,'14:00',2,5,2,'realizado');mk(-15,'09:30',0,4,2,'realizado');mk(-12,'16:00',1,3,0,'realizado');
  mk(-9,'11:00',3,2,1,'realizado');mk(-7,'15:00',6,8,2,'realizado');mk(-5,'10:30',4,6,2,'realizado');mk(-4,'13:00',7,1,0,'faltou');
  mk(-2,'09:00',0,4,2,'realizado');mk(-1,'17:00',5,7,1,'realizado');
  mk(0,'09:00',2,5,2,'confirmado');mk(0,'10:30',1,1,0,'confirmado');mk(0,'14:00',7,6,2,'agendado');mk(0,'16:00',3,9,2,'agendado');
  mk(1,'09:30',4,2,1,'confirmado');mk(1,'15:00',6,8,2,'agendado');mk(2,'10:00',5,3,0,'agendado');mk(2,'11:30',0,4,2,'agendado');
  mk(3,'14:30',2,5,2,'agendado');mk(4,'09:00',1,7,1,'agendado');mk(mon+5-0>4?mon+5:5,'10:00',3,6,2,'agendado');
  fin.push({id:uid(),data:iso(addDays(TODAY,-25)),tipo:'despesa',desc:'Aluguel da sala',valor:3200,status:'pago',forma:'Transferência'});
  fin.push({id:uid(),data:iso(addDays(TODAY,-10)),tipo:'despesa',desc:'Compra de toxina e ácido hialurônico',valor:4100,status:'pago',forma:'Boleto'});
  fin.push({id:uid(),data:iso(addDays(TODAY,5)),tipo:'despesa',desc:'Comissão esteticista',valor:1350,status:'pendente',forma:'Pix'});
  return {procs,pacientes,ag,fin};
}
let db;
db=window.__DB;
if(!db||!db.procs){db=seed();db.pacientes=[];db.ag=[];db.fin=[];db.__novo=true}
const save=()=>window.SYNC.save(db);
const P=id=>db.pacientes.find(x=>x.id===id)||{nome:'(paciente removido)'};
const PR=id=>db.procs.find(x=>x.id===id)||{nome:'(procedimento removido)',preco:0};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2400)}
const pill=s=>`<span class="pill p-${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const idade=n=>{if(!n)return'';const b=parse(n);let a=TODAY.getFullYear()-b.getFullYear();if(TODAY<new Date(TODAY.getFullYear(),b.getMonth(),b.getDate()))a--;return a+' anos'};

let view='painel',weekOff=0,q='';
function go(v){view=v;try{localStorage.setItem('cb-view',v)}catch(e){}render()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

function render(){
  if(VIEWMOD[view]&&!can(VIEWMOD[view]))view='painel';
  document.querySelectorAll('#nav button').forEach(b=>{b.setAttribute('aria-current',b.dataset.v===view);b.hidden=!!VIEWMOD[b.dataset.v]&&!can(VIEWMOD[b.dataset.v])});
  $('#view').innerHTML=({painel,agenda,pacientes,procedimentos,financeiro,importar,admin,pacotes,estoque,relatorios,marketing,online})[view]();
}
function monthFin(){const m=T.slice(0,7);return db.fin.filter(f=>f.data.slice(0,7)===m)}
function painel(){
  const hoje=db.ag.filter(a=>a.data===T).sort((a,b)=>a.hora.localeCompare(b.hora));
  const mf=monthFin();const rec=mf.filter(f=>f.tipo==='receita').reduce((s,f)=>s+f.valor,0);
  const desp=mf.filter(f=>f.tipo==='despesa').reduce((s,f)=>s+f.valor,0);
  const aReceber=db.fin.filter(f=>f.tipo==='receita'&&f.status==='pendente').reduce((s,f)=>s+f.valor,0);
  const prox7=db.ag.filter(a=>a.data>T&&a.data<=iso(addDays(TODAY,7))&&a.status!=='cancelado').length;
  // retornos: último procedimento realizado + retorno dias
  const ret=[];db.pacientes.forEach(p=>{const ult=db.ag.filter(a=>a.pac===p.id&&a.status==='realizado').sort((a,b)=>b.data.localeCompare(a.data))[0];
    if(!ult)return;const futuro=db.ag.some(a=>a.pac===p.id&&a.data>=T&&a.status!=='cancelado');if(futuro)return;
    const r=iso(addDays(parse(ult.data),PR(ult.proc).retorno||30));ret.push({p,ult,r})});
  ret.sort((a,b)=>a.r.localeCompare(b.r));
  const cnt={};db.ag.filter(a=>a.status==='realizado').forEach(a=>cnt[a.proc]=(cnt[a.proc]||0)+PR(a.proc).preco);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);const mx=top[0]?top[0][1]:1;
  return `<div class="head"><div><h1>${new Date().getHours()<12?'Bom dia':new Date().getHours()<18?'Boa tarde':'Boa noite'}, ${esc(ME().nome.split(' ')[0])}</h1><p>${TODAY.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div>
    <button class="btn" onclick="formAg()">Novo agendamento</button></div>
  <div class="grid kpis">
    <div class="kpi"><small>Atendimentos hoje</small><b>${hoje.length}</b><span>${hoje.filter(a=>a.status==='confirmado').length} confirmados</span></div>
    <div class="kpi"><small>Próximos 7 dias</small><b>${prox7}</b><span>agendamentos</span></div>
    ${can('financeiro')?`<div class="kpi"><small>Receita do mês</small><b>${BRL(rec)}</b><span>Despesas ${BRL(desp)}</span></div>
    <div class="kpi"><small>A receber</small><b>${BRL(aReceber)}</b><span>pagamentos pendentes</span></div>`:`<div class="kpi"><small>Pacientes</small><b>${db.pacientes.length}</b><span>cadastrados</span></div><div class="kpi"><small>Retornos pendentes</small><b>${ret.length}</b><span>sem horário marcado</span></div>`}
  </div>
  <div class="grid two">
    <div class="panel"><h2>Agenda de hoje <button class="link" onclick="go('agenda')">Ver semana</button></h2>
      <div class="list">${hoje.length?hoje.map(a=>`<div class="row"><div class="time">${a.hora}</div><div class="grow"><b>${esc(P(a.pac).nome)}</b><span>${esc(PR(a.proc).nome)} · ${esc(a.prof)}</span></div>${pill(a.status)}<button class="btn ghost sm" onclick="verAg('${a.id}')">Abrir</button></div>`).join(''):'<div class="empty">Nenhum atendimento hoje.</div>'}</div></div>
    <div class="panel"><h2>Retornos a agendar</h2>
      <div class="list">${ret.slice(0,5).map(x=>`<div class="row"><div class="grow"><b>${esc(x.p.nome)}</b><span>${esc(PR(x.ult.proc).nome)} em ${fmtD(x.ult.data)} · retorno ${x.r<T?'<b style="display:inline;color:var(--bad)">atrasado</b>':'em '+fmtD(x.r)}</span></div><button class="btn ghost sm" onclick="formAg(null,'${x.p.id}','${x.ult.proc}')">Agendar</button></div>`).join('')||'<div class="empty">Todos os pacientes estão com retorno marcado.</div>'}</div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Procedimentos que mais faturaram</h2>
    <div class="rank">${top.map(([id,v])=>`<div><div class="lbl"><b>${esc(PR(id).nome)}</b><span>${BRL(v)}</span></div><div class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join('')||'<div class="empty">Ainda sem atendimentos realizados.</div>'}</div></div>`;
}
function agenda(){
  const dow=TODAY.getDay();const mon=addDays(TODAY,(dow===0?-6:1-dow)+weekOff*7);
  const days=[...Array(6)].map((_,i)=>addDays(mon,i));
  return `<div class="head"><div><h1>Agenda</h1><p>Semana de ${days[0].toLocaleDateString('pt-BR')} a ${days[5].toLocaleDateString('pt-BR')}</p></div>
    <div class="toolbar" style="margin:0"><button class="btn ghost" onclick="weekOff--;render()">‹ Anterior</button><button class="btn ghost" onclick="weekOff=0;render()">Hoje</button><button class="btn ghost" onclick="weekOff++;render()">Próxima ›</button><button class="btn" onclick="formAg()">Novo agendamento</button></div></div>
  <div class="week">${days.map(d=>{const s=iso(d);const it=db.ag.filter(a=>a.data===s).sort((a,b)=>a.hora.localeCompare(b.hora));
    return `<div class="day ${s===T?'today':''}"><h3>${d.toLocaleDateString('pt-BR',{weekday:'short'})}<b>${d.getDate()}</b></h3>
    ${it.map(a=>`<button class="appt s-${a.status}" onclick="verAg('${a.id}')"><b>${a.hora} · ${esc(P(a.pac).nome)}</b><span>${esc(PR(a.proc).nome)}</span></button>`).join('')||'<div class="empty" style="font-size:12.5px">Livre</div>'}</div>`}).join('')}</div>`;
}
function pacientes(){
  const l=db.pacientes.filter(p=>(p.nome+p.tel).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="head"><div><h1>Pacientes</h1><p>${db.pacientes.length} cadastrados</p></div><button class="btn" onclick="formPac()">Novo paciente</button></div>
  <div class="toolbar"><input id="busca" placeholder="Buscar por nome ou telefone" value="${esc(q)}" oninput="q=this.value;const c=this.selectionStart;render();const i=$('#busca');i.focus();i.setSelectionRange(c,c)"></div>
  <div class="panel table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th class="hide-sm">Idade</th><th class="hide-sm">Último atendimento</th><th class="num">Total gasto</th><th></th></tr></thead><tbody>
  ${l.map(p=>{const h=db.ag.filter(a=>a.pac===p.id&&a.status==='realizado').sort((a,b)=>b.data.localeCompare(a.data));const tot=h.reduce((s,a)=>s+PR(a.proc).preco,0);
    return `<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.tel)}</td><td class="hide-sm">${idade(p.nasc)}</td><td class="hide-sm">${h[0]?fmtD(h[0].data)+' · '+esc(PR(h[0].proc).nome):'—'}</td><td class="num">${BRL(tot)}</td><td class="num"><button class="btn ghost sm" onclick="verPac('${p.id}')">Ficha</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Nenhum paciente encontrado.</td></tr>'}
  </tbody></table></div>`;
}
function procedimentos(){
  const cats=[...new Set(db.procs.map(p=>p.cat))];
  return `<div class="head"><div><h1>Procedimentos</h1><p>Tabela de serviços, preços e protocolos</p></div><button class="btn" onclick="formProc()">Novo procedimento</button></div>
  ${cats.map(c=>`<h2 style="font-size:15px;margin:18px 0 10px;color:var(--muted)">${esc(c)}</h2><div class="grid cards">${db.procs.filter(p=>p.cat===c).map(p=>`<div class="proc"><div class="cat">${esc(p.cat)}</div><h3>${esc(p.nome)}</h3><div class="price">${BRL(p.preco)}</div>
    <div class="meta"><span>${p.dur} min · ${p.sessoes} ${p.sessoes>1?'sessões':'sessão'}</span><span>retorno ${p.retorno} d</span></div><button class="link" style="font-size:12.5px" onclick="formProc('${p.id}')">Editar</button></div>`).join('')}</div>`).join('')}`;
}
function financeiro(){
  const mf=monthFin();const rec=mf.filter(f=>f.tipo==='receita').reduce((s,f)=>s+f.valor,0);const desp=mf.filter(f=>f.tipo==='despesa').reduce((s,f)=>s+f.valor,0);
  const pend=db.fin.filter(f=>f.tipo==='receita'&&f.status==='pendente').reduce((s,f)=>s+f.valor,0);
  const pagar=db.fin.filter(f=>f.tipo==='despesa'&&f.status==='pendente').reduce((s,f)=>s+f.valor,0);
  const l=[...db.fin].sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="head"><div><h1>Financeiro</h1><p>${TODAY.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</p></div><div class="toolbar" style="margin:0"><button class="btn ghost" onclick="formFin('despesa')">Lançar despesa</button><button class="btn" onclick="formFin('receita')">Lançar receita</button></div></div>
  <div class="grid kpis"><div class="kpi"><small>Receitas do mês</small><b>${BRL(rec)}</b></div><div class="kpi"><small>Despesas do mês</small><b>${BRL(desp)}</b></div>
  <div class="kpi"><small>Resultado</small><b style="color:${rec-desp>=0?'var(--ok)':'var(--bad)'}">${BRL(rec-desp)}</b></div><div class="kpi"><small>A receber / a pagar</small><b style="font-size:19px">${BRL(pend)}</b><span>a pagar ${BRL(pagar)}</span></div></div>
  <div class="panel table-wrap" style="margin-top:16px"><table><thead><tr><th>Data</th><th>Descrição</th><th class="hide-sm">Forma</th><th>Situação</th><th class="num">Valor</th><th></th></tr></thead><tbody>
  ${l.map(f=>`<tr><td>${fmtD(f.data)}</td><td>${esc(f.desc)}</td><td class="hide-sm">${esc(f.forma)}</td><td>${pill(f.status)}</td><td class="num" style="color:${f.tipo==='receita'?'var(--ok)':'var(--bad)'}">${f.tipo==='receita'?'+':'−'} ${BRL(f.valor)}</td>
  <td class="num">${f.status==='pendente'?`<button class="btn ghost sm" onclick="receber('${f.id}')">${f.tipo==='receita'?'Receber':'Pagar'}</button>`:f.tipo==='receita'?(f.nf?`<span class="muted">NF ${f.nf}</span>`:`<button class="btn ghost sm" onclick="emitirNF('${f.id}')">Emitir NF</button>`):''}</td></tr>`).join('')}</tbody></table></div>${blocoComissoes()}`;
}
/* ---------- importação ---------- */
const CAMPOS=[['nome','Nome',/nome|cliente|paciente/],['tel','Telefone',/tel|cel|whats|fone|phone/],['email','E-mail',/mail/],['nasc','Nascimento',/nasc|anivers|birth/],['obs','Observações',/obs|nota|anamn|coment/]];
let imp=null;
function importar(){
  return `<div class="head"><div><h1>Importar dados</h1><p>Traga seus clientes do app de agenda que você usa hoje</p></div></div>
  <div class="steps"><div><b>1. Exporte</b>No app atual, procure a opção de exportar clientes (geralmente em Configurações ou Relatórios) e baixe a planilha.</div>
  <div><b>2. Envie aqui</b>Aceita arquivos .xlsx, .xls ou .csv. A primeira linha deve ter os nomes das colunas.</div>
  <div><b>3. Confira e importe</b>O sistema reconhece as colunas sozinho. Ajuste se precisar e confirme.</div></div>
  <label class="drop" id="drop"><b>Escolha ou arraste a planilha de clientes</b><input type="file" id="arq" accept=".xlsx,.xls,.csv" onchange="lerArq(this.files[0])"></label>
  ${imp?`<div class="panel" style="margin-top:16px"><h2>${esc(imp.nome)} · ${imp.rows.length} linhas</h2>
    <p style="margin:0;color:var(--muted)">Indique qual coluna da planilha corresponde a cada campo:</p>
    <div class="map">${CAMPOS.map(([k,t])=>`<label>${t}<select id="m-${k}" onchange="imp.map.${k}=+this.value;render()"><option value="-1">Não importar</option>${imp.head.map((h,i)=>`<option value="${i}" ${imp.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>

function conv(k,v){if(v==null||v==='')return'';
  if(k==='nasc'){if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
    const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=y>30?1900:2000;return y+'-'+pad(m[2])+'-'+pad(m[1])}
    const m2=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:''}
  return String(v).trim()}
function csv(t){t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0];const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const out=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);out.push(row)}return out}
window.lerArq=f=>{if(!f||!need('importar'))return;const isCsv=/\.csv$/i.test(f.name);if(!isCsv&&!window.XLSX){toast('Não consegui carregar o leitor de Excel. Salve a planilha como .csv e tente de novo.');return}
  const r=new FileReader();r.onload=e=>{try{let rows;
    if(isCsv){const buf=new Uint8Array(e.target.result);let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('windows-1252').decode(buf);rows=csv(t)}
    else{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
    rows=rows.filter(r=>r.some(c=>String(c).trim()));
    if(rows.length<2){toast('A planilha parece vazia');return}
    const head=rows[0].map(String);const map={};CAMPOS.forEach(([k,,re])=>map[k]=head.findIndex(h=>re.test(h.toLowerCase())));
    imp={nome:f.name,head,rows:rows.slice(1),map};render()}catch(err){toast('Não consegui ler esse arquivo. Tente salvar como .xlsx ou .csv')}};r.readAsArrayBuffer(f)};

/* PDF */
const imgDims=src=>new Promise(res=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=()=>res(null);i.src=src});
async function makePdf(id,parte){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const e=db.evol.find(x=>x.id===id);const p=P(e.pac),r=regDe(e.prof);
  const W=210,M=18,INK=[27,38,36],MUT=[93,109,105],ACC=[31,111,98];let y=0,first=true;
  const txt=(c)=>doc.setTextColor(...c);
  const header=t=>{if(!first)doc.addPage();first=false;doc.setFillColor(...ACC);doc.rect(0,0,W,3,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(16);txt(INK);doc.text((db.clinica&&db.clinica.nome)||'Clínica Bezerra',M,17);
    doc.setFont('helvetica','normal');doc.setFontSize(9);txt(MUT);const cl=db.clinica||{};doc.text([cl.endereco,cl.cidade&&cl.cidade+'/'+cl.uf,cl.tel].filter(Boolean).join(' · ')||'Estética avançada',M,22);
    doc.setFont('helvetica','bold');doc.setFontSize(12);txt(ACC);doc.text(t,W-M,17,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(9);txt(MUT);doc.text(dtFmt(e.data),W-M,22,{align:'right'});
    doc.setDrawColor(215,224,221);doc.line(M,26,W-M,26);
    doc.setFontSize(9.5);txt(INK);doc.setFont('helvetica','bold');doc.text('Paciente: ',M,33);doc.setFont('helvetica','normal');doc.text(p.nome,M+17,33);
    const lin2=[p.nasc?'Nascimento: '+fmtD(p.nasc)+' ('+idade(p.nasc)+')':'',p.tel?'Telefone: '+p.tel:''].filter(Boolean).join('     ');txt(MUT);doc.text(lin2,M,38.5);y=48};
  const brk=h=>{if(y+h>272){doc.addPage();y=20}};
  const para=(s,size=10,color=INK,lh=5)=>{doc.setFont('helvetica','normal');doc.setFontSize(size);txt(color);doc.splitTextToSize(s,W-2*M).forEach(l=>{brk(lh);doc.text(l,M,y);y+=lh})};
  const sec=(t,b)=>{if(!b)return;brk(14);doc.setFont('helvetica','bold');doc.setFontSize(8.5);txt(ACC);doc.text(t.toUpperCase(),M,y,{charSpace:.3});y+=5;para(b);y+=3};
  const assinatura=(eletr)=>{brk(34);y+=14;doc.setDrawColor(...MUT);doc.line(W/2-40,y,W/2+40,y);y+=5;doc.setFont('helvetica','bold');doc.setFontSize(10);txt(INK);doc.text(e.prof,W/2,y,{align:'center'});y+=4.5;
    doc.setFont('helvetica','normal');doc.setFontSize(9);txt(MUT);doc.text([r.titulo,r.reg].filter(Boolean).join(' · '),W/2,y,{align:'center'});y+=4.5;
    if(eletr)doc.text(e.status==='assinada'?'Registro assinado no sistema em '+dtFmt(e.assinadaEm):'RASCUNHO - documento ainda não assinado',W/2,y,{align:'center'});y+=6};
  if(parte==='tudo'){header('Evolução clínica');
    const info=[['Tipo de atendimento',e.tipo],['Profissional',e.prof+(r.reg?' - '+r.reg:'')],e.proc?['Procedimento',PR(e.proc).nome]:null,e.fototipo?['Fototipo (Fitzpatrick)','Tipo '+e.fototipo]:null].filter(Boolean);
    info.forEach(([k,v])=>{doc.setFont('helvetica','bold');doc.setFontSize(9.5);txt(MUT);doc.text(k,M,y);doc.setFont('helvetica','normal');txt(INK);doc.text(v,M+45,y);y+=5.5});y+=4;
    sec('Queixa principal e história',e.queixa);sec('Avaliação e exame físico',e.exame);sec('Procedimento realizado ou plano',e.conduta);sec('Produtos utilizados',e.produtos);
    sec('Orientações',e.orient);sec('Intercorrências',e.interc);
    sec('Consentimento e retorno',(e.tcle?'Termo de consentimento livre e esclarecido assinado.':'Termo de consentimento não registrado.')+(e.retorno?' Retorno previsto em '+fmtD(e.retorno)+'.':''));
    if(e.atestado)sec('Atestado emitido',e.atestado.dias+' dia(s) de afastamento a partir de '+fmtD(e.atestado.inicio)+'. Documento na página seguinte.');
    if(e.exames)sec('Exames solicitados',[...e.exames.lista,...(e.exames.outros?[e.exames.outros]:[])].join(', ')+'. Pedido na página seguinte.');
    if(e.mapa?.length){brk(95);doc.setFont('helvetica','bold');doc.setFontSize(8.5);txt(ACC);doc.text('MAPA FACIAL DE APLICAÇÃO',M,y);y+=4;const k=.38,ox=M,oy=y;doc.setDrawColor(150,160,158);doc.setLineWidth(.3);
      doc.ellipse(ox+100*k,oy+122*k,66*k,92*k);doc.ellipse(ox+70*k,oy+106*k,13*k,5*k);doc.ellipse(ox+130*k,oy+106*k,13*k,5*k);doc.line(ox+52*k,oy+92*k,ox+84*k,oy+88*k);doc.line(ox+116*k,oy+88*k,ox+148*k,oy+92*k);doc.line(ox+100*k,oy+110*k,ox+100*k,oy+142*k);doc.ellipse(ox+100*k,oy+174*k,20*k,6*k);
      doc.setFillColor(...ACC);doc.setFontSize(7.5);e.mapa.forEach(p=>{doc.circle(ox+p.x*k,oy+p.y*k,1.3,'F');txt(INK);doc.text(String(p.u),ox+p.x*k+2,oy+p.y*k+1)});y=oy+240*k+4}
    (e.adendos||[]).forEach(a=>sec('Adendo de '+dtFmt(a.data)+' - '+a.prof,a.texto));

  if(e.atestado&&(parte==='tudo'||parte==='atestado')){header('Atestado');y+=10;const a=e.atestado;

    if(a.texto){y+=3;para(a.texto,11.5,INK,7)}

    y+=10;para(((db.clinica&&db.clinica.cidade)?db.clinica.cidade+', ':'Emitido em ')+parse(e.data.slice(0,10)).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})+'.',11,INK,6);assinatura(false)}

    [...e.exames.lista,...(e.exames.outros?e.exames.outros.split(',').map(s=>s.trim()).filter(Boolean):[])].forEach((x,i)=>{brk(7);doc.setFont('helvetica','normal');doc.setFontSize(11);txt(INK);doc.text((i+1)+'.  '+x,M+4,y);y+=7});

  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);txt(MUT);doc.setFont('helvetica','normal');

  return doc}
const extenso=n=>['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze'][n]||String(n);
window.pdfEvol=async(id,parte)=>{if(!window.jspdf){toast('Não consegui carregar o gerador de PDF. Recarregue a página.');return}
  const e=db.evol.find(x=>x.id===id);const doc=await makePdf(id,parte);
  const nome=({tudo:'evolucao',atestado:'atestado',exames:'pedido-exames'})[parte]+'-'+P(e.pac).nome.split(' ')[0].normalize('NFD').replace(/[^\w]/g,'').toLowerCase()+'-'+e.data.slice(0,10)+'.pdf';
  const dl=window.DL;
  if(!dl){toast('Download indisponível nesta visualização. Abra o sistema pelo claude.ai');return}
  try{await dl.save({filename:nome,data:doc.output('arraybuffer')});log('Gerou PDF ('+parte+') de '+P(e.pac).nome);toast('PDF salvo')}catch(err){if(err?.code!=='declined')toast('Não foi possível salvar o PDF agora')}};

function admin(){

  const tabs=[['colab','Colaboradores'],['forn','Fornecedores'],['perms','Perfis e permissões'],['log','Registro de acessos'],['clinica','Dados da clínica']];
  const body={colab:admColab,forn:admForn,perms:admPerms,log:admLog,clinica:admClinica}[admTab]();
  return `<div class="head"><div><h1>Administração</h1><p>Área restrita ao perfil Administrador</p></div><button class="btn ghost" onclick="adminOk=false;log('Fechou a área de administração');go('painel')">Sair da área restrita</button></div>

        db.mov.unshift({data:new Date().toISOString(),item,lote:l.lote,qtd:-u,tipo:'Saída',ref:PR(a.proc).nome+' · '+P(a.pac).nome})});
      if(falta>0)toast('Estoque insuficiente de '+it.nome)});a.feito=true}
  else if(a.status!=='realizado'&&a.feito){if(a.pacote){const k=db.pacotes.find(x=>x.id===a.pacote);if(k)k.usadas--;a.pacote=null}
    (a.baixa||[]).forEach(b=>{const l=ITEM(b.item).lotes.find(x=>x.lote===b.lote);if(l)l.qtd+=b.qtd;db.mov.unshift({data:new Date().toISOString(),item:b.item,lote:b.lote,qtd:b.qtd,tipo:'Estorno',ref:PR(a.proc).nome+' · '+P(a.pac).nome})});a.baixa=[];a.feito=false}}

/* ---- recebimento: Pix (QR), cartão, nota fiscal ---- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const semAcento=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();
function pixPayload(chave,valor,nome,cidade,txid){const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986')+(valor?tlv('54',valor.toFixed(2)):'')+tlv('58','BR')+tlv('59',semAcento(nome).slice(0,25)||'CLINICA')+tlv('60',semAcento(cidade).slice(0,15)||'BRASIL')+tlv('62',tlv('05',(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';return p+crc16(p)}
