  <label class="full">Tomador (paciente)<input id="nf-tom" value="${esc(pac.nome||'')}" required></label><label>CPF do tomador<input id="nf-cpf" value="${esc(pac.cpf||'')}" placeholder="000.000.000-00"></label><label>Valor<input value="${BRL(f.valor)}" disabled></label>
  <label class="full">Descrição do serviço<input id="nf-desc" value="${esc(f.desc.split(' · ')[0])}"></label><label>Código do serviço (LC 116)<input id="nf-cod" value="06.02"></label><label>Alíquota ISS (%)<input type="number" step="0.01" id="nf-iss" value="5"></label>
  <div class="actions"><button type="button" class="btn ghost" onclick="dlg.close()">Cancelar</button><button class="btn">Emitir (simulação)</button></div></form>`);
  $('#fnf').onsubmit=e=>{e.preventDefault();const n={id:uid(),num:String(db.nf.length+1).padStart(6,'0'),fin:f.id,tom:$('#nf-tom').value,cpf:$('#nf-cpf').value,desc:$('#nf-desc').value,valor:f.valor,iss:+(f.valor*(+$('#nf-iss').value)/100).toFixed(2),data:T};db.nf.push(n);f.nf=n.num;log('Emitiu NFS-e '+n.num+' (simulação) para '+n.tom);save();dlg.close();render();toast('Nota '+n.num+' emitida (simulação)')}};

/* ---- comissões ---- */
function comissoes(mes){return db.colab.filter(c=>c.comissao>0&&c.atende).map(c=>{const nome=c.exib||c.nome;const at=db.ag.filter(a=>a.prof===nome&&a.status==='realizado'&&a.data.slice(0,7)===mes);
  const base=at.reduce((s,a)=>s+(a.pacote?(()=>{const k=db.pacotes.find(x=>x.id===a.pacote);return k?k.valor/k.sessoes:0})():PR(a.proc).preco),0);
  return {c,nome,qtd:at.length,base,valor:+(base*c.comissao/100).toFixed(2),lancado:db.fin.some(f=>f.comissao===c.id+mes)}})}
function blocoComissoes(){const mes=T.slice(0,7);const l=comissoes(mes);
  return `<div class="panel table-wrap" style="margin-top:16px"><h2>Comissões de ${mesesN[+mes.slice(5)-1]}/${mes.slice(0,4)}</h2><table><thead><tr><th>Profissional</th><th class="num">Atendimentos</th><th class="num">Base</th><th class="num">%</th><th class="num">Comissão</th><th></th></tr></thead><tbody>
  ${l.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td class="num">${x.qtd}</td><td class="num">${BRL(x.base)}</td><td class="num">${x.c.comissao}%</td><td class="num"><b>${BRL(x.valor)}</b></td><td class="num">${x.lancado?'<span class="pill p-realizado">Lançada</span>':x.valor?`<button class="btn ghost sm" onclick="lancarCom('${x.c.id}')">Lançar a pagar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma profissional com comissão cadastrada.</td></tr>'}</tbody></table>
  <p class="hint">Base: valor dos atendimentos realizados no mês. Sessões de pacote contam pelo valor proporcional da sessão. O percentual vem do cadastro do colaborador.</p></div>`}
window.lancarCom=cid=>{if(!need('financeiro'))return;const mes=T.slice(0,7);const x=comissoes(mes).find(y=>y.c.id===cid);db.fin.push({id:uid(),data:iso(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,5)),tipo:'despesa',desc:`Comissão ${x.nome} · ${mesesN[+mes.slice(5)-1]}/${mes.slice(0,4)}`,valor:x.valor,status:'pendente',forma:x.c.pix?'Pix':'Transferência',comissao:cid+mes});log('Lançou comissão de '+x.nome);save();render();toast('Comissão lançada em contas a pagar')};

/* ---- mapa facial ---- */
const FACE=`<ellipse cx="100" cy="122" rx="66" ry="92" class="fc"/><path d="M52 92 q16-10 32-2 M116 90 q16-8 32 2" class="fl"/><ellipse cx="70" cy="106" rx="13" ry="5" class="fl"/><ellipse cx="130" cy="106" rx="13" ry="5" class="fl"/><path d="M100 110 v32 q-8 6 -12 2 M100 142 q8 6 12 2" class="fl"/><path d="M80 172 q20 -8 40 0 q-20 14 -40 0 Z" class="fl"/><path d="M34 120 q-8 4 -4 18 M166 120 q8 4 4 18" class="fl"/>`;
let mapa=[];
function mapaSVG(pts,edit){return `<svg viewBox="0 0 200 240" class="face" ${edit?'id="facemap" onclick="addPonto(event)"':''} role="img" aria-label="Mapa facial com ${pts.length} pontos">${FACE}${pts.map((p,i)=>`<g><circle cx="${p.x}" cy="${p.y}" r="4.5" class="pt"/><text x="${p.x+7}" y="${p.y+3}" class="ptl">${esc(p.u)}</text></g>`).join('')}</svg>`}
window.addPonto=ev=>{const svg=$('#facemap');const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());mapa.push({x:Math.round(q.x),y:Math.round(q.y),u:$('#mp-u').value||'•'});drawMapa()};
function drawMapa(){$('#mapabox').innerHTML=mapaSVG(mapa,true);$('#mp-list').textContent=mapa.length?mapa.length+' ponto(s). Total: '+mapa.reduce((s,p)=>s+(parseFloat(String(p.u).replace(',','.'))||0),0)+' (soma dos valores)':'Clique no rosto para marcar cada ponto de aplicação.'}

/* ---- antes e depois ---- */
window.antesDepois=pac=>{const fotos=db.evol.filter(e=>e.pac===pac).sort((a,b)=>a.data.localeCompare(b.data)).flatMap(e=>(e.anexos||[]).filter(a=>a.tipo.startsWith('image/')).map(a=>({...a,quando:e.data})));
  if(fotos.length<2){modal('Antes e depois',`<div class="detail"><p class="hint">Para comparar, anexe pelo menos duas fotos nas evoluções desta paciente (uma antes e outra depois do tratamento).</p><button class="btn ghost sm" onclick="verPac('${pac}')">Voltar à ficha</button></div>`);return}
  const o=fotos.map((f,i)=>[String(i),fmtD(f.quando.slice(0,10))+' · '+f.nome]);
  modal('Antes e depois · '+esc(P(pac).nome),`<div class="detail"><div class="toolbar" style="margin:0"><label class="muted">Antes<select id="ad-a">${opt(o,'0')}</select></label><label class="muted">Depois<select id="ad-b">${opt(o,String(fotos.length-1))}</select></label></div>
  <div class="cmp" id="cmp"><img id="ad-ib" alt="Depois"><div class="cmp-a" id="cmp-a"><img id="ad-ia" alt="Antes"></div><span class="tag l">Antes</span><span class="tag r">Depois</span></div>
  <input type="range" id="ad-r" min="0" max="100" value="50" aria-label="Deslize para comparar"><button class="btn ghost sm" onclick="verPac('${pac}')">Voltar à ficha</button></div>`,true);
  const up=()=>{$('#ad-ia').src=fotos[+$('#ad-a').value].data;$('#ad-ib').src=fotos[+$('#ad-b').value].data;$('#cmp-a').style.width=$('#ad-r').value+'%';$('#ad-ia').style.width=$('#cmp').clientWidth+'px'};
  ['ad-a','ad-b','ad-r'].forEach(i=>$('#'+i).oninput=up);$('#ad-ib').onload=up;up()};

/* ---- termos de consentimento com assinatura ---- */
const TERMO_TXT=(pac,proc)=>`Eu, ${P(pac).nome}, declaro que fui informada de forma clara pela equipe da ${db.clinica.nome||'Clínica Bezerra'} sobre o procedimento ${PR(proc).nome}: como é feito, os resultados esperados, que os resultados variam de pessoa para pessoa, os cuidados antes e depois, e os possíveis efeitos e riscos, como vermelhidão, inchaço, hematomas, assimetria, reações alérgicas e, raramente, infecção.

Informei meu histórico de saúde, alergias e medicamentos em uso, e me comprometo a seguir as orientações recebidas. Tive a oportunidade de fazer perguntas, que foram respondidas.

Autorizo a realização do procedimento e o registro de fotografias para acompanhamento no meu prontuário, que só serão usadas para outros fins com minha autorização por escrito. Sei que posso revogar este consentimento a qualquer momento antes do procedimento.`;
window.formTermo=(pac,proc)=>{modal('Termo de consentimento',`<form class="f" id="ftm"><label class="full">Procedimento<select id="tm-proc" onchange="$('#tm-txt').textContent=TERMO_TXT('${pac}',this.value)">${opt(db.procs.map(p=>[p.id,p.nome]),proc||db.procs[0].id)}</select></label>
  <div class="full termo" id="tm-txt">${esc(TERMO_TXT(pac,proc||db.procs[0].id))}</div>
  <label class="chk full"><input type="checkbox" id="tm-ok" required> Li e concordo com este termo</label>
  <div class="full"><div class="muted" style="margin-bottom:4px">Assinatura da paciente (com o dedo ou o mouse)</div><canvas id="sig" class="sig"></canvas><button type="button" class="link" style="font-size:12.5px" onclick="sigClear()">Limpar assinatura</button></div>
  <div class="actions"><button type="button" class="btn ghost" onclick="verPac('${pac}')">Cancelar</button><button class="btn">Registrar termo assinado</button></div></form>`,true);
  const cv=$('#sig'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);cx.lineWidth=2.2;cx.lineCap='round';cx.strokeStyle='#1b2624';let drawing=false,tem=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pos(e))};cv.onpointermove=e=>{if(!drawing)return;cx.lineTo(...pos(e));cx.stroke();tem=true};cv.onpointerup=()=>drawing=false;
  window.sigClear=()=>{cx.clearRect(0,0,cv.width,cv.height);tem=false};
  $('#ftm').onsubmit=e=>{e.preventDefault();if(!tem){toast('Peça para a paciente assinar no quadro');return}const t={id:uid(),pac,proc:$('#tm-proc').value,texto:$('#tm-txt').textContent,assinatura:cv.toDataURL('image/png'),data:new Date().toISOString(),por:ME().nome};
    db.termos.push(t);log('Registrou termo assinado de '+P(pac).nome+' para '+PR(t.proc).nome);if(!save()){toast('Sem espaço no navegador');return}verPac(pac);toast('Termo assinado registrado')}};
window.pdfTermo=async id=>{const t=db.termos.find(x=>x.id===id);if(!window.jspdf){toast('Gerador de PDF indisponível. Recarregue a página');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=18;doc.setFillColor(31,111,98);doc.rect(0,0,W,3,'F');doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(db.clinica.nome||'Clínica Bezerra',M,17);
  doc.setFontSize(12);doc.setTextColor(31,111,98);doc.text('Termo de consentimento',W-M,17,{align:'right'});doc.setTextColor(27,38,36);doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  let y=32;doc.splitTextToSize(t.texto,W-2*M).forEach(l=>{doc.text(l,M,y);y+=5.6});y+=8;doc.addImage(t.assinatura,'PNG',W/2-35,y,70,26);y+=28;doc.line(W/2-40,y,W/2+40,y);y+=5;doc.setFont('helvetica','bold');doc.text(P(t.pac).nome,W/2,y,{align:'center'});
  y+=5;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(93,109,105);doc.text('Assinado na clínica em '+dtFmt(t.data)+' · registrado por '+t.por,W/2,y,{align:'center'});
  const dl=window.DL;if(!dl){toast('Download indisponível nesta visualização');return}
  try{await dl.save({filename:'termo-'+P(t.pac).nome.split(' ')[0].normalize('NFD').replace(/[^\w]/g,'').toLowerCase()+'-'+t.data.slice(0,10)+'.pdf',data:doc.output('arraybuffer')});log('Gerou PDF do termo de '+P(t.pac).nome);toast('PDF salvo')}catch(err){if(err?.code!=='declined')toast('Não foi possível salvar agora')}};
function blocoFicha(pac){const tm=db.termos.filter(t=>t.pac===pac);const pk=db.pacotes.filter(k=>k.pac===pac);const pts=pontos(pac);
  return `<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><div class="kpi"><small>Fidelidade</small><b style="font-size:20px">${pts} pts</b><span>${nivel(pts)}</span></div>
  <div class="kpi"><small>Pacotes</small><b style="font-size:20px">${pk.filter(k=>k.usadas<k.sessoes).length} ativo(s)</b><span>${pk.map(k=>`${esc(PR(k.proc).nome.split(' ')[0])} ${k.usadas}/${k.sessoes}`).join(' · ')||'nenhum'}</span></div>
  <div class="kpi"><small>Termos assinados</small><b style="font-size:20px">${tm.length}</b><span>${tm.slice(-1).map(t=>esc(PR(t.proc).nome)).join('')||'nenhum'}</span></div></div>
  ${tm.length?`<div class="list">${tm.map(t=>`<div class="row"><img src="${t.assinatura}" alt="Assinatura" class="sigmini"><div class="grow"><b>Termo · ${esc(PR(t.proc).nome)}</b><span>Assinado em ${dtFmt(t.data)}</span></div><button class="btn ghost sm" onclick="pdfTermo('${t.id}')">PDF</button></div>`).join('')}</div>`:''}
  <div class="toolbar" style="margin:0">${can('vendas','editar')?`<button class="btn ghost sm" onclick="formPacote('${pac}')">Vender pacote</button>`:''}${can('prontuario','editar')?`<button class="btn ghost sm" onclick="formTermo('${pac}')">Assinar termo</button>`:''}${can('prontuario')?`<button class="btn ghost sm" onclick="antesDepois('${pac}')">Antes e depois</button>`:''}</div>`}

/* ---- fidelidade e marketing ---- */
const gasto=pac=>db.ag.filter(a=>a.pac===pac&&a.status==='realizado').reduce((s,a)=>s+(a.pacote?0:PR(a.proc).preco),0)+db.pacotes.filter(k=>k.pac===pac).reduce((s,k)=>s+k.valor,0);
const pontos=pac=>Math.floor(gasto(pac)/(db.fidel.real||10));
const nivel=p=>p>=500?'Nível Ouro':p>=200?'Nível Prata':'Nível Bronze';
function listaRetornos(){const r=[];db.pacientes.forEach(p=>{const ult=db.ag.filter(a=>a.pac===p.id&&a.status==='realizado').sort((a,b)=>b.data.localeCompare(a.data))[0];if(!ult)return;
  if(db.ag.some(a=>a.pac===p.id&&a.data>=T&&a.status!=='cancelado'))return;r.push({p,ult,r:iso(addDays(parse(ult.data),PR(ult.proc).retorno||30))})});return r.sort((a,b)=>a.r.localeCompare(b.r))}
const wa=(tel,msg)=>tel?`https://wa.me/55${String(tel).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`:'';
const primeiro=p=>p.nome.split(' ')[0];
let campPub='aniv',campMsg='Olá, {nome}! A Clínica Bezerra preparou uma condição especial para você este mês. Quer que eu te mostre os horários disponíveis?';
function publico(k){const m=T.slice(5,7);const ult=p=>db.ag.filter(a=>a.pac===p.id&&a.status==='realizado').map(a=>a.data).sort().pop();
  if(k==='aniv')return db.pacientes.filter(p=>p.nasc&&p.nasc.slice(5,7)===m);
  if(k==='ret')return listaRetornos().map(x=>x.p);
  if(k==='inat')return db.pacientes.filter(p=>{const u=ult(p);return !u||u<iso(addDays(TODAY,-90))});
  if(k==='ouro')return db.pacientes.filter(p=>pontos(p.id)>=200);return db.pacientes}
function marketing(){const m=T.slice(5,7);const aniv=db.pacientes.filter(p=>p.nasc&&p.nasc.slice(5,7)===m).sort((a,b)=>a.nasc.slice(8).localeCompare(b.nasc.slice(8)));const ret=listaRetornos();
  const top=[...db.pacientes].map(p=>({p,pts:pontos(p.id)})).sort((a,b)=>b.pts-a.pts).slice(0,6);const lista=publico(campPub);
  return `<div class="head"><div><h1>Marketing e relacionamento</h1><p>Aniversariantes, retornos, fidelidade e campanhas pelo WhatsApp</p></div></div>
  <div class="grid two" style="margin-top:0"><div class="panel"><h2>Aniversariantes de ${mesesN[+m-1]}</h2><div class="list">${aniv.map(p=>`<div class="row"><div class="time">${p.nasc.slice(8)}/${m}</div><div class="grow"><b>${esc(p.nome)}</b><span>${idade(p.nasc).replace(/\d+/,n=>+n+(p.nasc.slice(5)>T.slice(5)?1:0))} no aniversário</span></div>${p.tel?`<a class="btn ghost sm" target="_blank" rel="noopener" href="${wa(p.tel,`Feliz aniversário, ${primeiro(p)}! 🎉 A equipe da Clínica Bezerra deseja um ano lindo. Como presente, você tem 10% de desconto em qualquer procedimento até o fim do mês.`)}">Parabenizar</a>`:''}</div>`).join('')||'<div class="empty">Ninguém faz aniversário este mês.</div>'}</div></div>
  <div class="panel"><h2>Retornos para lembrar</h2><div class="list">${ret.slice(0,6).map(x=>`<div class="row"><div class="grow"><b>${esc(x.p.nome)}</b><span>${esc(PR(x.ult.proc).nome)} · retorno ${x.r<T?'atrasado desde':'em'} ${fmtD(x.r)}</span></div>${x.p.tel?`<a class="btn ghost sm" target="_blank" rel="noopener" href="${wa(x.p.tel,`Olá, ${primeiro(x.p)}! Já está na hora do seu retorno de ${PR(x.ult.proc).nome} na Clínica Bezerra. Quer que eu reserve um horário para você?`)}">Chamar</a>`:''}</div>`).join('')||'<div class="empty">Nenhum retorno pendente.</div>'}</div></div></div>
  <div class="grid two"><div class="panel"><h2>Programa de fidelidade</h2><p class="hint" style="margin:0 0 10px">A cada ${BRL(db.fidel.real)} gastos a paciente ganha 1 ponto. ${db.fidel.resgate} pontos valem ${BRL(db.fidel.desconto)} de desconto. Bronze até 199, Prata de 200 a 499, Ouro a partir de 500.</p>
    <div class="list">${top.map(x=>`<div class="row"><div class="grow"><b>${esc(x.p.nome)}</b><span>${nivel(x.pts)} · ${BRL(gasto(x.p.id))} gastos</span></div><b>${x.pts} pts</b>${x.pts>=db.fidel.resgate?'<span class="pill p-realizado">Pode resgatar</span>':''}</div>`).join('')}</div></div>
  <div class="panel"><h2>Campanha pelo WhatsApp</h2><div class="att"><label class="muted">Público<select id="cp-pub" onchange="campPub=this.value;render()">${opt([['aniv','Aniversariantes do mês'],['ret','Retornos pendentes'],['inat','Sem atendimento há 90 dias'],['ouro','Prata e Ouro da fidelidade'],['todos','Todas as pacientes']],campPub)}</select></label>
    <label class="muted">Mensagem (use {nome} para o primeiro nome)<textarea id="cp-msg" rows="3" oninput="campMsg=this.value">${esc(campMsg)}</textarea></label>
    <div class="list">${lista.map(p=>`<div class="row"><div class="grow"><b>${esc(p.nome)}</b><span>${esc(p.tel||'sem telefone')}</span></div>${p.tel?`<a class="btn ghost sm" target="_blank" rel="noopener" href="#" data-pid="${p.id}" onclick="campSend(this)">Enviar</a>`:''}</div>`).join('')||'<div class="empty">Ninguém neste público.</div>'}</div>
    <p class="hint">Cada envio abre o WhatsApp com a mensagem pronta. O disparo automático em massa exige a API oficial do WhatsApp Business.</p></div></div></div>`}

/* ---- relatórios ---- */
function relatorios(){const meses=[...Array(6)].map((_,i)=>{const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-5+i,1);return iso(d).slice(0,7)});
  const recM=meses.map(m=>db.fin.filter(f=>f.tipo==='receita'&&f.data.slice(0,7)===m).reduce((s,f)=>s+f.valor,0));const despM=meses.map(m=>db.fin.filter(f=>f.tipo==='despesa'&&f.data.slice(0,7)===m).reduce((s,f)=>s+f.valor,0));
  const mx=Math.max(1,...recM,...despM);const ini=iso(addDays(TODAY,-90));const per=db.ag.filter(a=>a.data>=ini&&a.data<=T);
  const real=per.filter(a=>a.status==='realizado'),falt=per.filter(a=>a.status==='faltou');const taxa=(real.length+falt.length)?falt.length/(real.length+falt.length)*100:0;
  const porPac={};db.ag.filter(a=>a.status==='realizado').forEach(a=>porPac[a.pac]=(porPac[a.pac]||0)+1);const atend=Object.keys(porPac).length,volt=Object.values(porPac).filter(n=>n>1).length;
  const fat=real.reduce((s,a)=>s+PR(a.proc).preco,0);const tk=real.length?fat/real.length:0;const novos=db.pacientes.filter(p=>p.desde>=ini).length;
  const rank=(key)=>{const o={};real.forEach(a=>{const k=key(a);o[k]=(o[k]||0)+PR(a.proc).preco});const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);const m=e[0]?e[0][1]:1;return e.map(([k,v])=>`<div><div class="lbl"><b>${esc(k)}</b><span>${BRL(v)}</span></div><div class="bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div></div>`).join('')||'<div class="empty">Sem dados.</div>'};
  const H=150,bw=22;
  return `<div class="head"><div><h1>Relatórios</h1><p>Indicadores dos últimos 90 dias e faturamento dos últimos 6 meses</p></div></div>
  <div class="grid kpis"><div class="kpi"><small>Faturamento (90 dias)</small><b>${BRL(fat)}</b><span>${real.length} atendimentos</span></div><div class="kpi"><small>Ticket médio</small><b>${BRL(tk)}</b><span>por atendimento</span></div>
  <div class="kpi"><small>Taxa de faltas</small><b style="color:${taxa>10?'var(--bad)':'inherit'}">${taxa.toFixed(1)}%</b><span>${falt.length} falta(s)</span></div><div class="kpi"><small>Clientes que voltaram</small><b>${atend?Math.round(volt/atend*100):0}%</b><span>${volt} de ${atend} · ${novos} nova(s)</span></div></div>
  <div class="panel" style="margin-top:16px"><h2>Receitas e despesas por mês <span class="legend"><i class="lg r"></i>Receitas <i class="lg d"></i>Despesas</span></h2><div class="chart-wrap"><svg viewBox="0 0 ${meses.length*80+50} ${H+40}" class="chart" role="img" aria-label="Receitas e despesas por mês">
  ${[0,.5,1].map(f=>`<line x1="44" x2="${meses.length*80+50}" y1="${10+H-f*H}" y2="${10+H-f*H}" class="gl"/><text x="40" y="${14+H-f*H}" class="ax" text-anchor="end">${(mx*f/1000).toFixed(1).replace('.',',')}k</text>`).join('')}
  ${meses.map((m,i)=>{const x=60+i*80;const hr=recM[i]/mx*H,hd=despM[i]/mx*H;return `<rect x="${x}" y="${10+H-hr}" width="${bw}" height="${hr}" rx="3" class="br"><title>${BRL(recM[i])}</title></rect><rect x="${x+bw+4}" y="${10+H-hd}" width="${bw}" height="${hd}" rx="3" class="bd"><title>${BRL(despM[i])}</title></rect><text x="${x+bw+2}" y="${H+28}" class="ax" text-anchor="middle">${mesesN[+m.slice(5)-1]}</text>`}).join('')}</svg></div></div>
  <div class="grid two"><div class="panel"><h2>Faturamento por procedimento</h2><div class="rank">${rank(a=>PR(a.proc).nome)}</div></div><div class="panel"><h2>Faturamento por profissional</h2><div class="rank">${rank(a=>a.prof)}</div></div></div>`}

/* ---- agendamento online ---- */
const toMin=h=>{const [a,b]=h.split(':').map(Number);return a*60+b},toH=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function slots(data,prof,proc){const o=db.online;const d=parse(data);if(d.getDay()===0)return[];const dur=PR(proc).dur||30;const oc=db.ag.filter(a=>a.data===data&&a.prof===prof&&a.status!=='cancelado').map(a=>[toMin(a.hora),toMin(a.hora)+(PR(a.proc).dur||30)]);
  const now=new Date();const out=[];for(let m=toMin(o.inicio);m+dur<=toMin(o.fim);m+=+o.passo){if(data===T&&m<=now.getHours()*60+now.getMinutes())continue;if(oc.some(([s,e])=>m<e&&m+dur>s))continue;out.push(toH(m))}return out}
let bk={step:1};
function online(){const o=db.online;const amanha=iso(addDays(TODAY,1));const lemb=db.ag.filter(a=>a.data===amanha&&['agendado','confirmado'].includes(a.status));
  const doOnline=db.ag.filter(a=>a.origem==='online');
  return `<div class="head"><div><h1>Agendamento online</h1><p>A paciente escolhe o horário sozinha pelo link na bio do Instagram ou no WhatsApp</p></div></div>
  <div class="grid two" style="margin-top:0;grid-template-columns:1fr 380px"><div class="grid" style="gap:16px;align-content:start">
  <div class="panel"><h2>Configuração</h2><div class="att"><label class="chk"><input type="checkbox" id="on-at" ${o.ativo?'checked':''} onchange="db.online.ativo=this.checked;save()"> Agendamento online ligado</label>
    <p class="hint">Link para divulgar: <b>${location.origin}/agendar.html</b></p>
    <div class="sub"><label>Abre às<input type="time" id="on-ini" value="${o.inicio}" onchange="db.online.inicio=this.value;save()"></label><label>Fecha às<input type="time" id="on-fim" value="${o.fim}" onchange="db.online.fim=this.value;save()"></label>
    <label>Intervalo entre horários<select id="on-passo" onchange="db.online.passo=+this.value;save()">${opt([['15','15 min'],['30','30 min'],['60','60 min']],String(o.passo))}</select></label></div>
    <div class="muted">Procedimentos que aparecem no agendamento online</div><div class="exlist">${db.procs.map(p=>`<label class="chk"><input type="checkbox" ${o.procs.includes(p.id)?'checked':''} onchange="togOn('${p.id}',this.checked)"> ${esc(p.nome)}</label>`).join('')}</div></div></div>
  <div class="panel"><h2>Lembretes automáticos</h2><div class="att"><label class="chk"><input type="checkbox" id="on-lb" ${o.lembrete?'checked':''} onchange="db.online.lembrete=this.checked;save()"> Enviar lembrete no WhatsApp um dia antes</label>
    <label class="muted">Mensagem ({nome}, {procedimento}, {data}, {hora}, {profissional})<textarea id="on-msg" rows="3" onchange="db.online.msg=this.value;save();render()">${esc(o.msg)}</textarea></label>
    <div class="muted">Fila de amanhã (${fmtD(amanha)})</div><div class="list">${lemb.map(a=>{const p=P(a.pac);return `<div class="row"><div class="time">${a.hora}</div><div class="grow"><b>${esc(p.nome)}</b><span>${esc(PR(a.proc).nome)}</span></div>${p.tel?`<a class="btn ghost sm" target="_blank" rel="noopener" href="${wa(p.tel,msgLembrete(a))}">Enviar</a>`:''}</div>`}).join('')||'<div class="empty">Nenhum horário amanhã.</div>'}</div>
    <p class="hint">No protótipo cada lembrete abre o WhatsApp para você enviar. O envio sozinho, sem clique, exige a API oficial do WhatsApp Business.</p></div></div>
  ${doOnline.length?`<div class="panel"><h2>Agendados pela internet</h2><div class="list">${doOnline.map(a=>`<div class="row"><div class="grow"><b>${esc(P(a.pac).nome)}</b><span>${fmtD(a.data)} às ${a.hora} · ${esc(PR(a.proc).nome)}</span></div>${pill(a.status)}</div>`).join('')}</div></div>`:''}</div>
  <div><div class="phone"><div class="phone-in">${bookingUI()}</div></div><p class="hint" style="text-align:center;margin-top:8px">Prévia do que a paciente vê no celular. Pode testar.</p></div></div>`}
const msgLembrete=a=>{const p=P(a.pac);return db.online.msg.replaceAll('{nome}',primeiro(p)).replaceAll('{procedimento}',PR(a.proc).nome).replaceAll('{data}',fmtD(a.data)).replaceAll('{hora}',a.hora).replaceAll('{profissional}',a.prof)};
window.togOn=(id,v)=>{const s=new Set(db.online.procs);v?s.add(id):s.delete(id);db.online.procs=[...s];save();render()};
function bookingUI(){if(!db.online.ativo)return '<div class="bk"><h3>Clínica Bezerra</h3><p class="hint">O agendamento online está desligado no momento.</p></div>';
  const ps=db.procs.filter(p=>db.online.procs.includes(p.id));const dias=[...Array(10)].map((_,i)=>iso(addDays(TODAY,i))).filter(d=>parse(d).getDay()!==0);
  const head=`<div class="bk-h"><b>Clínica Bezerra</b><span>Agende seu horário</span></div>`;
  if(bk.step===1)return `<div class="bk">${head}<div class="bk-t">1. Escolha o procedimento</div>${ps.map(p=>`<button class="bk-o" onclick="bk={step:2,proc:'${p.id}'};render()"><b>${esc(p.nome)}</b><span>${p.dur} min · ${BRL(p.preco)}</span></button>`).join('')}</div>`;
  if(bk.step===2){const profs=PROFS();bk.prof=bk.prof||profs[0];bk.data=bk.data||dias.find(d=>slots(d,bk.prof,bk.proc).length)||dias[0];const sl=slots(bk.data,bk.prof,bk.proc);
    return `<div class="bk">${head}<button class="link bk-back" onclick="bk={step:1};render()">‹ ${esc(PR(bk.proc).nome)}</button><div class="bk-t">2. Profissional, dia e horário</div>
    <select onchange="bk.prof=this.value;render()" aria-label="Profissional">${opt(profs.map(p=>[p,p]),bk.prof)}</select>
    <div class="bk-days">${dias.map(d=>{const x=parse(d);return `<button class="${d===bk.data?'on':''}" onclick="bk.data='${d}';render()"><span>${x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span><b>${x.getDate()}</b></button>`}).join('')}</div>
    <div class="bk-slots">${sl.map(h=>`<button onclick="bk.hora='${h}';bk.step=3;render()">${h}</button>`).join('')||'<p class="hint">Sem horários livres neste dia.</p>'}</div></div>`}
  return `<div class="bk">${head}<button class="link bk-back" onclick="bk.step=2;render()">‹ Voltar</button><div class="bk-t">3. Seus dados</div><div class="bk-sum">${esc(PR(bk.proc).nome)}<br>${parse(bk.data).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} às ${bk.hora}<br>com ${esc(bk.prof)}</div>
    <form id="fbk" class="att"><input id="bk-nome" placeholder="Nome completo" required><input id="bk-tel" placeholder="WhatsApp com DDD" required><label class="chk" style="font-size:12px"><input type="checkbox" required> Concordo com o uso dos meus dados para o agendamento (LGPD)</label><button class="btn">Confirmar agendamento</button></form></div>`}
document.addEventListener('submit',e=>{if(e.target.id!=='fbk')return;e.preventDefault();const tel=$('#bk-tel').value,nome=$('#bk-nome').value.trim();const n=s=>String(s).replace(/\D/g,'');
  let p=db.pacientes.find(x=>n(x.tel)&&n(x.tel)===n(tel));if(!p){p={id:uid(),nome,tel,nasc:'',obs:'',desde:T,origem:'online'};db.pacientes.push(p)}
  if(!slots(bk.data,bk.prof,bk.proc).includes(bk.hora)){toast('Esse horário acabou de ser ocupado. Escolha outro');bk.step=2;render();return}
  db.ag.push({id:uid(),data:bk.data,hora:bk.hora,pac:p.id,proc:bk.proc,prof:bk.prof,status:'agendado',origem:'online'});log('Agendamento online: '+p.nome+' em '+fmtD(bk.data)+' '+bk.hora);save();bk={step:1};render();toast('Agendamento online recebido. Ele já está na agenda')});

window.campSend=el=>{const p=P(el.dataset.pid);el.href=wa(p.tel,campMsg.replaceAll('{nome}',primeiro(p)));log('Enviou campanha para '+p.nome)};

window.go=go;
try{const v=localStorage.getItem('cb-view');if(v)view=v}catch(e){}
userBox();render();if(db.__novo){delete db.__novo;save();setTimeout(()=>{toast('Sistema criado. Cadastre a equipe em Administração');go('admin')},400)}
</script>
<script>
/* Clínica Bezerra · conexão com o banco (Supabase), login e sincronização */
window.ONLINE = true;
const CB = window.CB_CONFIG || {};
const sb = window.supabase.createClient(CB.url, CB.key, { auth: { persistSession: true, autoRefreshToken: true } });
const ARR = ['procs','pacientes','ag','fin','evol','colab','forn','estoque','mov','pacotes','termos','nf','camp'];
const OBJ = ['clinica','perms','online','fidel'];
const snap = new Map();
const q$ = s => document.querySelector(s);

/* ---------- download de arquivos (PDF) ---------- */
window.DL = { save({ filename, data }) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); return Promise.resolve({ status: 'saved' });
} };

/* ---------- tela de login ---------- */
let modo = 'entrar';
function msgAuth(t, erro) { const m = q$('#au-msg'); m.textContent = t || ''; m.className = 'au-msg' + (erro ? ' err' : ''); }
function trocaModo(m) {
  modo = m; q$('#au-t').textContent = { entrar: 'Entrar', criar: 'Primeiro acesso', esqueci: 'Recuperar senha', nova: 'Criar nova senha' }[m];
  q$('#au-pass-w').hidden = m === 'esqueci'; q$('#au-mail-w').hidden = m === 'nova';
  q$('#au-btn').textContent = { entrar: 'Entrar', criar: 'Criar minha senha', esqueci: 'Enviar link por e-mail', nova: 'Salvar nova senha' }[m];
  q$('#au-pass').autocomplete = m === 'entrar' ? 'current-password' : 'new-password';
  q$('#au-links').hidden = m === 'nova'; msgAuth('');
}
window.trocaModo = trocaModo;
q$('#au-form').addEventListener('submit', async e => {
  e.preventDefault(); const email = q$('#au-mail').value.trim(), senha = q$('#au-pass').value; const b = q$('#au-btn'); b.disabled = true;
  try {
    if (modo === 'entrar') { const { error } = await sb.auth.signInWithPassword({ email, password: senha }); if (error) throw error; }
    else if (modo === 'criar') {
      if (senha.length < 8) throw new Error('Use uma senha com pelo menos 8 caracteres.');
      const { data, error } = await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) throw error;
      if (!data.session) msgAuth('Enviamos um e-mail de confirmação para ' + email + '. Abra o link e depois entre com sua senha.');
    } else if (modo === 'esqueci') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw error;
      msgAuth('Se o e-mail estiver cadastrado, você vai receber um link para criar nova senha.');
    } else if (modo === 'nova') {
      if (senha.length < 8) throw new Error('Use uma senha com pelo menos 8 caracteres.');
      const { error } = await sb.auth.updateUser({ password: senha }); if (error) throw error; msgAuth('Senha atualizada.'); iniciar();
    }
  } catch (err) { msgAuth(traduz(err.message), true); }
  b.disabled = false;
});
function traduz(m) {
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if (/already registered/i.test(m)) return 'Este e-mail já tem senha. Use Entrar ou Esqueci a senha.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (/fetch/i.test(m)) return 'Sem conexão com a internet.';
  return m;
}

/* ---------- carga dos dados ---------- */
async function carregar() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('registros').select('colecao,id,dados').range(from, from + 999);
    if (error) throw error; rows.push(...data); if (data.length < 1000) break;
  }
  const db = {}; ARR.forEach(k => db[k] = []);
  rows.forEach(r => { snap.set(r.colecao + '|' + r.id, JSON.stringify(r.dados)); if (r.colecao === 'config') db[r.id] = r.dados; else (db[r.colecao] = db[r.colecao] || []).push(r.dados); });
  const { data: logs } = await sb.from('acessos').select('quando,nome,perfil,acao').order('quando', { ascending: false }).limit(300);
  db.log = (logs || []).map(l => ({ q: l.quando, u: l.nome, perfil: l.perfil, acao: l.acao }));
  return db;
}

/* ---------- gravação: só o que mudou, registro por registro ---------- */
function linhas(db) {
  const m = new Map();
  ARR.forEach(k => (db[k] || []).forEach(o => { if (!o.id) o.id = Math.random().toString(36).slice(2, 10); m.set(k + '|' + o.id, o); }));
  OBJ.forEach(k => { if (db[k]) m.set('config|' + k, db[k]); });
  return m;
}
let timer = null, fila = Promise.resolve(), erroAberto = false;
function status(t, erro) { const s = q$('#sync'); if (s) { s.textContent = t; s.classList.toggle('err', !!erro); } }
async function flush() {
  const cur = linhas(db); const up = [], del = [];
  cur.forEach((o, k) => { const j = JSON.stringify(o); if (snap.get(k) !== j) { const i = k.indexOf('|'); up.push({ k, j, row: { colecao: k.slice(0, i), id: k.slice(i + 1), dados: o } }); } });
  snap.forEach((j, k) => { if (!cur.has(k) && !k.startsWith('config|')) del.push(k); });
  if (!up.length && !del.length) return;
  status('Salvando…');
  const ordem = c => c === 'colab' ? 0 : c === 'config' ? 1 : 2;
  up.sort((a, b) => ordem(a.row.colecao) - ordem(b.row.colecao));
  try {
    // colaboradores, depois configurações, depois o resto: cada grupo num envio separado,
    // porque o banco só libera o resto depois que o colaborador já está gravado
    const grupos = [0, 1, 2].map(n => up.filter(x => ordem(x.row.colecao) === n));
    const lotes = []; grupos.forEach(g => { for (let i = 0; i < g.length; i += 100) lotes.push(g.slice(i, i + 100)); });
    for (const lote of lotes) {
      const { error } = await sb.from('registros').upsert(lote.map(x => x.row));
      if (error) throw error; lote.forEach(x => snap.set(x.k, x.j));
    }
    const porCol = {}; del.forEach(k => { const i = k.indexOf('|'); (porCol[k.slice(0, i)] = porCol[k.slice(0, i)] || []).push(k.slice(i + 1)); });
    for (const [c, ids] of Object.entries(porCol)) {
      const { error } = await sb.from('registros').delete().eq('colecao', c).in('id', ids);
      if (error) throw error; ids.forEach(id => snap.delete(c + '|' + id));
    }
    status('Tudo salvo'); erroAberto = false;
  } catch (err) {
    const semNet = !navigator.onLine || /fetch/i.test(err.message || '');
    status(semNet ? 'Sem internet. Vou tentar de novo' : 'Não foi possível salvar', true);
    if (!semNet && !erroAberto) { erroAberto = true; window.toast && toast('Não foi possível salvar: ' + (/row-level|permission/i.test(err.message) ? 'seu perfil não tem permissão para essa alteração' : err.message) + '. Recarregando os dados.'); setTimeout(() => location.reload(), 2500); }
  }
}
window.SYNC = {
  save() { clearTimeout(timer); timer = setTimeout(() => { fila = fila.then(flush); }, 350); return true; },
  log(nome, perfil, acao) { sb.from('acessos').insert({ nome, perfil, acao }).then(() => {}); }
};
window.addEventListener('online', () => window.SYNC.save());
window.addEventListener('beforeunload', e => { if (timer) { clearTimeout(timer); flush(); } });

/* ---------- atualização ao vivo vinda de outros computadores ---------- */
let precisaRender = false;
function aoVivo() {
  sb.channel('registros').on('postgres_changes', { event: '*', schema: 'public', table: 'registros' }, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if (!r || !r.colecao) return; const k = r.colecao + '|' + r.id;
    if (p.eventType === 'DELETE') {
      if (!snap.has(k)) return; snap.delete(k); if (db[r.colecao]) db[r.colecao] = db[r.colecao].filter(x => x.id !== r.id);
    } else {
      const j = JSON.stringify(r.dados); if (snap.get(k) === j) return; snap.set(k, j);
      if (r.colecao === 'config') db[r.id] = r.dados;
      else { const a = db[r.colecao] = db[r.colecao] || []; const i = a.findIndex(x => x.id === r.id); if (i >= 0) a[i] = r.dados; else a.push(r.dados); }
    }
    if (document.getElementById('dlg').open) precisaRender = true; else render();
  }).subscribe();
  document.getElementById('dlg').addEventListener('close', () => { if (precisaRender) { precisaRender = false; render(); } });
}

/* ---------- início ---------- */
window.sairSistema = async () => { await sb.auth.signOut(); location.reload(); };
window.confirmaSenha = async (senha) => { const { error } = await sb.auth.signInWithPassword({ email: window.__USER.email, password: senha }); return !error; };
let iniciado = false;
async function iniciar() {
  if (iniciado) return; iniciado = true;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { iniciado = false; q$('#auth').hidden = false; q$('#carregando').hidden = true; return; } window.__USER = session.user; q$('#auth').hidden = true; q$('#carregando').hidden = false;
  try {
    const { data: vazio, error: e1 } = await sb.rpc('sistema_vazio'); if (e1) throw e1;
    const { data: eu } = await sb.rpc('meu_colab');
    if (!vazio && !eu) {
      q$('#carregando').innerHTML = `<div class="au-card"><h1>Acesso não liberado</h1><p>O e-mail <b>${session.user.email.replace(/</g, '&lt;')}</b> ainda não está cadastrado como colaborador ativo. Peça ao administrador para cadastrar você em Administração, Colaboradores, com este mesmo e-mail.</p><button class="btn" onclick="sairSistema()">Sair</button></div>`;
      return;
    }
    window.__DB = vazio ? null : await carregar();
    const s = document.createElement('script'); s.textContent = document.getElementById('app-src').textContent; document.body.appendChild(s);
    q$('#carregando').hidden = true; q$('.app').hidden = false;
    aoVivo(); log('Entrou no sistema'); status('Tudo salvo');
  } catch (err) {
    q$('#carregando').innerHTML = `<div class="au-card"><h1>Não foi possível abrir</h1><p>${traduz(err.message || String(err)).replace(/</g, '&lt;')}</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { q$('#auth').hidden = false; q$('#carregando').hidden = true; trocaModo('nova'); } else if (ev === 'SIGNED_IN') setTimeout(iniciar, 0); }); // fora do aviso de login, senão a biblioteca trava esperando a si mesma
iniciar();
// rede de segurança: se travar no "Carregando…", oferece tentar de novo
setTimeout(() => { const c = q$('#carregando'); if (c && !c.hidden && q$('.app').hidden && /Carregando/.test(c.textContent)) c.innerHTML = '<div class="au-card"><h1>Está demorando…</h1><p>Não consegui abrir o sistema. Verifique a internet e tente de novo.</p><button class="btn" onclick="location.reload()">Tentar de novo</button> <button class="btn ghost" onclick="sairSistema()">Sair e entrar de novo</button></div>'; }, 20000);

/* ---------- instalar como aplicativo ---------- */
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; const b = q$('#instalar'); if (b) b.hidden = false; });
window.instalarApp = async () => { if (!pedidoInstalar) return; pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; q$('#instalar').hidden = true; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
